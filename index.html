<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#22305c">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Robot Run</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.3.1/spark.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="stick-zone" aria-hidden="true">
      <div id="stick-base"><div id="stick-knob"></div></div>
    </div>

    <div id="hud">
      <div id="counters">
        <div id="counter" class="pill" role="status" aria-live="polite">
          <span class="gem-icon" aria-hidden="true"></span>
          <span id="count">0</span><span class="total">/ <span id="total">0</span></span>
        </div>
        <div id="keys" class="pill" role="status" aria-live="polite" aria-label="Keys found" hidden>
          <svg class="icon" viewBox="-3 -3 36 36" aria-hidden="true">
            <defs>
              <g id="key-shape">
                <circle cx="9" cy="15" r="6"/>
                <rect x="13" y="13" width="14" height="4"/>
                <rect x="19" y="16" width="3" height="6"/>
                <rect x="24" y="16" width="3" height="5"/>
              </g>
            </defs>
            <g transform="rotate(-45 15 15)">
              <use href="#key-shape" fill="#22305c" stroke="#22305c" stroke-width="5" stroke-linejoin="round"/>
              <use href="#key-shape" fill="#ffd23c"/>
              <circle cx="9" cy="15" r="2.2" fill="#22305c"/>
            </g>
          </svg>
          <span id="key-count">0</span><span class="total">/ <span id="key-total">0</span></span>
        </div>
        <div id="chests" class="pill" role="status" aria-live="polite" aria-label="Chests opened" hidden>
          <svg class="icon" viewBox="0 0 30 30" aria-hidden="true">
            <defs>
              <path id="chest-shape" d="M4 25 V13 Q4 6 11 6 H19 Q26 6 26 13 V25 Z"/>
            </defs>
            <use href="#chest-shape" fill="#22305c" stroke="#22305c" stroke-width="5" stroke-linejoin="round"/>
            <use href="#chest-shape" fill="#9a5b2e"/>
            <rect x="4" y="13" width="22" height="3" fill="#22305c"/>
            <rect x="12.5" y="11.5" width="5" height="7" rx="1" fill="#ffd23c" stroke="#22305c" stroke-width="1.5"/>
          </svg>
          <span id="chest-count">0</span>
        </div>
      </div>
      <button id="fullscreen" type="button" aria-label="Toggle fullscreen">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div id="debug" hidden></div>
    </div>

    <div id="toast" hidden></div>

    <div id="win" hidden>
      <div class="panel">
        <p class="win-title" id="win-title">All gems collected</p>
        <p class="win-sub" id="win-time"></p>
        <button id="again" type="button">Play again</button>
      </div>
    </div>

    <div id="loading">Loading…</div>
  </div>

  <div id="rotate-hint">Turn the tablet sideways to play</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
